# Lab Prometheus: kısa aralıklar, kısa "for" süreleri (arıza enjeksiyonu dakikalar içinde sonuç versin diye).
global:
  scrape_interval: 5s
  evaluation_interval: 5s

rule_files:
  - rules/*.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["127.0.0.1:9093"]

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["127.0.0.1:9090"]
  - job_name: node
    static_configs:
      - targets: ["127.0.0.1:9100"]
        labels:
          env: lab
