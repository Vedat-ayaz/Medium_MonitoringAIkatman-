groups:
  - name: lab-node
    rules:
      - alert: HighCPU
        expr: 100 - (avg by (instance) (rate(node_cpu_seconds_total{mode="idle"}[30s])) * 100) > 70
        for: 15s
        labels:
          severity: warning
        annotations:
          summary: "CPU kullanımı %70 üstünde ({{ $labels.instance }})"

      - alert: HighLoadAverage
        expr: node_load1 > 1.0
        for: 15s
        labels:
          severity: warning
        annotations:
          summary: "1 dakikalık load 1.0 üstünde ({{ $labels.instance }})"

      - alert: LowMemoryAvailable
        expr: node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes < 0.40
        for: 15s
        labels:
          severity: high
        annotations:
          summary: "Kullanılabilir bellek %40 altında ({{ $labels.instance }})"

      - alert: TargetDown
        expr: up == 0
        for: 15s
        labels:
          severity: critical
        annotations:
          summary: "Hedef yanıt vermiyor ({{ $labels.instance }})"
